name: Daily Checkin

on:
  schedule:
    # Every 6 hours (UTC 0, 6, 12, 18)
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  checkin:
    runs-on: ubuntu-26.04

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          # 刻意不指定 python-version：由 pyproject.toml 的 requires-python
          # (>=3.10) 決定，uv 會自動挑選系統上相容的 Python

      - name: Install dependencies
        run: uv sync --locked

      - name: Cache Playwright Browsers
        uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: uv run playwright install chromium --with-deps --no-shell

      - name: Install Playwright Deps (cached)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: uv run playwright install-deps chromium

      - name: Run checkin
        env:
          CHECKIN_ACCOUNTS: ${{ vars.CHECKIN_ACCOUNTS }}
          CHECKIN_NOTIFY: ${{ vars.CHECKIN_NOTIFY }}
          COOKIES_CACHE: ${{ vars.COOKIES_CACHE }}
        run: uv run checkin.py
